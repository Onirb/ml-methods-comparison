[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-methods-comparison"
version = "0.1.0"
description = "Reproducible experiments comparing classical machine-learning classifiers on synthetic datasets."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.5",
  "pandas==3.1.1",
  "matplotlib==3.11.2",
  "seaborn==0.13.2",
  "scikit-learn==1.9.1",
  "mlxtend==0.25.0",
  "nbclient==0.11.0",
  "ipykernel==7.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
